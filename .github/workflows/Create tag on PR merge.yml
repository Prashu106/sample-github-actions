name: Create Tag on PR Merge

on:
  push:
    branches:
      - main

jobs:
  create-tag:
    runs-on: ubuntu-latest

    steps:
    # Step 1: Checkout the code
    - name: Checkout code
      uses: actions/checkout@v2
    
    - name: Set up GitHub authentication
      env:
        GH_TOKEN: ${{ secrets.GH_TOKEN }}
      run: |
        git remote set-url origin https://x-access-token:${GH_TOKEN}@github.com/Prashu106/sample-github-actions.git

    # Step 2: Get the latest commit and create a new tag based on the commit
    - name: Create new tag based on commit
      run: |
        # Generate a new tag. You can use your own naming convention here.
        NEW_TAG="v$(date +'%Y.%m.%d.%H%M')"
        echo "Creating new tag: $NEW_TAG"
        git tag $NEW_TAG
        git push origin $NEW_TAG
        echo "Tag $NEW_TAG pushed to remote repository"
