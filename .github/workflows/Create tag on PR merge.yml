name: Create Tag on PR Merge

permissions:
  contents: write
  
on:
  push:
    branches:
      - main

jobs:
  create-tag:
    runs-on: ubuntu-latest

    steps:
    # Step 1: Checkout the code
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up GitHub authentication
      env:
        GH_TOKEN: ${{ secrets.GH_TOKEN }}
      run: |
        git remote set-url origin https://x-access-token:${GH_TOKEN}@github.com/Prashu106/sample-github-actions.git

    # Step 2: Get the latest commit and create a new tag based on the commit
    - name: Create new tag based on commit
      run: |
        
        # Fetch the latest tags from the remote repository
        git fetch --tags

        # Get the latest tag number
        LAST_TAG=$(git tag | grep -E '^v[0-9]+$' | sort -V | tail -n 1)
        echo $LAST_TAG
        # Increment the tag number
        if [ -z "$LAST_TAG" ]; then
          NEW_TAG="v1"
        else
          LAST_NUMBER=$(echo $LAST_TAG | sed 's/v//')
          NEW_NUMBER=$((LAST_NUMBER + 1))
          NEW_TAG="v$NEW_NUMBER"
        fi
        echo "Creating new tag: $NEW_TAG"
        git tag $NEW_TAG
        git push origin $NEW_TAG
        echo "Tag $NEW_TAG pushed to remote repository"
