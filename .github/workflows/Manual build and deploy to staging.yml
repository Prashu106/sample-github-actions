name: Manual Build and Deploy to Staging

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and deploy to Staging'
        required: true
        default: 'v1.0.0'  # Set the default tag or leave empty for manual input

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    # Step 1: Checkout the code
    - name: Checkout code
      uses: actions/checkout@v2

    # Step 2: Fetch all tags to make them available for selection
    - name: Fetch all tags
      run: |
        git fetch --tags
        echo "Available tags:"
        git tag

    # Step 3: Checkout the specific tag that the user selected
    - name: Checkout specific tag
      run: |
        echo "Checking out tag: ${{ github.event.inputs.tag }}"
        git checkout ${{ github.event.inputs.tag }}

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Build with Maven
      run: mvn clean install -DskipTests

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v1
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v1


    # Step 7: Build the Docker image with the selected tag
    - name: Build Docker image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: github-sample
      run: |
        docker build -t my-app:${{ github.event.inputs.tag }} .

    # Step 8: Tag Docker image for ECR (AWS)
    - name: Tag Docker image for ECR
      run: |
        docker tag my-app:${{ github.event.inputs.tag }} <aws_account_id>.dkr.ecr.<region>.amazonaws.com/my-app:${{ github.event.inputs.tag }}

    # Step 9: Push Docker image to AWS ECR
    - name: Push Docker image to AWS ECR
      run: |
        docker push <aws_account_id>.dkr.ecr.<region>.amazonaws.com/my-app:${{ github.event.inputs.tag }}

    # Optional: Deploy the Docker image (Example for staging)
    - name: Deploy Docker image to Staging
      run: |
        # Example deployment steps (replace with actual deployment commands)
        echo "Deploying Docker image to staging environment"
        # For example, ECS or EC2 deployment could go here.
