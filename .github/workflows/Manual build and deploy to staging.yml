name: Manual Build and Deploy to Staging

on:
  workflow_dispatch:
  
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    # Step 1: Checkout the code
    - name: Checkout code
      uses: actions/checkout@v2

    # Step 2: Fetch all tags to make them available for selection
    - name: Fetch all tags
      run: |
        git fetch --tags
        echo "Available tags:"
        git tag

    # Step 3: Checkout the specific tag that the user selected
    - name: Checkout specific tag
      run: |
        # Use cut to remove the refs/tags/ prefix
        TAG_NAME=$(echo $GITHUB_REF | sed 's/^refs\/tags\///')
        echo "The tag that triggered the workflow is: $GITHUB_REF"
        echo "Extracted tag name: $TAG_NAME"

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Build with Maven
      run: mvn clean install -DskipTests

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v1
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v1


    # Step 7: Build the Docker image with the selected tag
    - name: Build Docker image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: github-sample
      run: |
        echo ${{ github.event.inputs.tag }}
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$TAG_NAME .

    # Step 9: Push Docker image to AWS ECR
    - name: Push Docker image to AWS ECR
      run: |
        docker push -t $ECR_REGISTRY/$ECR_REPOSITORY:$TAG_NAME .
