name: Build and push image to ECR

on:
  pull_request:
    branches:
      - dev
      - int
      - prod

jobs:
  build:
    name: Build Image
    runs-on: ubuntu-latest

    steps:
    - name: Check out code
      uses: actions/checkout@v2

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Build with Maven
      run: mvn clean install -DskipTests

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v1
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v1

    - name: Determine Docker Image Tag
      id: version
      run: |
        # Check the branch name and set the image tag accordingly
        BRANCH_NAME="${GITHUB_REF##*/}"
        
        if [ "$BRANCH_NAME" == "dev" ]; then
          # For dev branch, use latest tag
          IMAGE_TAG="sample:latest"
        elif [ "$BRANCH_NAME" == "int" ]; then
          # For int branch, generate a semantic version (e.g., 1.0.0)
          VERSION=$(git describe --tags --abbrev=0 || echo "1.0.0")
          # Increment the version (patch version)
          IMAGE_TAG=sample:$(echo $VERSION | awk -F. -v OFS=. '{$NF++;print}')
        elif [ "$BRANCH_NAME" == "prod" ]; then
          # For prod branch, generate a stable semantic version (e.g., 2.0.0)
          VERSION=$(git describe --tags --abbrev=0 || echo "2.0.0")
          # Increment the version (minor version)
          IMAGE_TAG=sample:$(echo $VERSION | awk -F. -v OFS=. '{$2++;$3=0;print}')
        fi

        echo "VERSION=${IMAGE_TAG}" >> $GITHUB_ENV
        echo "Docker tag will be: $IMAGE_TAG"

    - name: Build, tag, and push image to Amazon ECR
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: github-sample
        IMAGE_TAG: ${{ env.VERSION }}
      run: |
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
